name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Dependency audit (production, high severity)
        run: npm run audit
      - name: Secret scan (tracked files)
        run: |
          if git grep -InE 'AIza[0-9A-Za-z_-]{35}|sk-[A-Za-z0-9]{20,}' -- . ':!package-lock.json'; then
            echo "Possible secret committed" && exit 1
          fi
      - run: npm run build
